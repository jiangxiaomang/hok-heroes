<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>王者荣耀全英雄攻略 · 133位英雄铭文出装连招大全</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0c14;
  --card:rgba(16,20,32,.96);
  --card-solid:#161c2a;
  --line:rgba(200,170,80,.2);
  --line-bright:rgba(200,170,80,.4);
  --text:#f5f0e6;
  --muted:#9a9284;
  --gold:#d4af37;
  --gold-bright:#f4d03f;
  --gold-dark:#8a6d1a;
  --blue:#4a9eff;
  --red:#c0392b;
  --blue-faction:#1a3a5c;
  --red-faction:#4a1a1a;
  --purple:#8e44ad;
  --green:#2ecc71;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue','PingFang SC','Microsoft YaHei',sans-serif;
  color:var(--text);
  line-height:1.6;
  min-height:100vh;
  background-color:#0a0c14;
  background-image:
    /* 通透暗化遮罩：顶部和两侧更通透，原画色彩显现 */
    radial-gradient(ellipse 90% 60% at 50% 20%, rgba(10,12,20,.45) 0%, rgba(10,12,20,.85) 100%),
    /* 王者荣耀官方英雄原画（盾山/铠 真实高清壁纸） */
    url('https://game.gtimg.cn/images/yxzj/img201606/skin/hero-info/199/199-bigskin-8.jpg');
  background-size:cover, cover;
  background-position:center top, center top;
  background-repeat:no-repeat, no-repeat;
  background-attachment:fixed, fixed;
}
/* 背景换肤切换按钮 */
.bg-switcher{
  position:fixed;right:16px;bottom:16px;z-index:200;
  display:flex;flex-direction:column;gap:8px;
}
.bg-btn{
  width:44px;height:44px;border-radius:50%;
  border:2px solid rgba(200,170,80,.4);
  background:rgba(20,26,38,.9);
  color:var(--gold-bright);
  cursor:pointer;font-size:18px;
  display:flex;align-items:center;justify-content:center;
  transition:all .25s;
  backdrop-filter:blur(8px);
}
.bg-btn:hover{border-color:var(--gold-bright);box-shadow:0 0 20px rgba(212,175,55,.4);transform:scale(1.08)}
/* 顶部装饰线：王者荣耀金色龙纹边框 */
body::before{
  content:'';
  position:fixed;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,transparent,var(--gold),var(--gold-bright),var(--gold),transparent);
  z-index:999;
  box-shadow:0 0 20px rgba(212,175,55,.5);
}
header{
  position:sticky;top:0;z-index:100;
  background:linear-gradient(180deg,rgba(10,12,20,.97) 0%,rgba(10,12,20,.88) 100%);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(200,170,80,.25);
  padding:20px 24px;
  box-shadow:0 4px 30px rgba(0,0,0,.6);
}
.header-inner{max-width:1200px;margin:0 auto}
h1{font-size:26px;font-weight:800;background:linear-gradient(135deg,var(--gold-bright),var(--gold),#e8b23f);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px;text-shadow:0 0 30px rgba(212,175,55,.3)}
.stats{display:flex;gap:24px;margin-top:8px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:center}
.stat-num{font-size:22px;font-weight:800;color:var(--gold-bright);text-shadow:0 0 15px rgba(212,175,55,.4)}
.stat-label{font-size:12px;color:var(--muted)}
nav{display:flex;gap:8px;padding:16px 24px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
.nav-btn{
  padding:9px 20px;
  border:1px solid var(--line);
  background:rgba(30,38,55,.8);
  color:var(--text);
  border-radius:6px;
  cursor:pointer;
  font-size:14px;
  font-weight:600;
  letter-spacing:1px;
  transition:all .25s;
  position:relative;
  overflow:hidden;
}
.nav-btn::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:0;transition:opacity .3s;
}
.nav-btn:hover{border-color:var(--gold-bright);color:var(--gold-bright);background:rgba(212,175,55,.08)}.nav-btn:hover::after{opacity:1}
.nav-btn.active{
  background:linear-gradient(135deg,var(--gold),var(--gold-dark));
  color:#0a0c14;border-color:var(--gold);
  font-weight:800;
  box-shadow:0 0 20px rgba(212,175,55,.35);
}
.search-box{max-width:1200px;margin:0 auto;padding:0 24px 16px}
.search-box input{
  width:100%;padding:13px 20px;
  border:1px solid rgba(200,170,80,.25);
  background:rgba(22,28,42,.85);
  color:var(--text);border-radius:8px;
  font-size:16px;outline:none;
  transition:all .3s;
}
.search-box input:focus{border-color:var(--gold);box-shadow:0 0 20px rgba(212,175,55,.15);background:rgba(30,38,55,.95)}
main{max-width:1200px;margin:0 auto;padding:0 24px 40px}
.lane-section{margin-bottom:32px}
.lane-header{
  display:flex;align-items:center;gap:16px;
  margin-bottom:16px;padding:20px;
  background:linear-gradient(135deg,rgba(30,38,55,.9),rgba(22,28,42,.9));
  border-radius:12px;
  border:1px solid rgba(200,170,80,.2);
  position:relative;overflow:hidden;
}
.lane-header::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
.lane-badge{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
.lane-对抗路 .lane-badge{background:linear-gradient(135deg,#c0392b,#8e2420);box-shadow:0 0 15px rgba(192,57,43,.4)}
.lane-打野 .lane-badge{background:linear-gradient(135deg,#8e44ad,#5e2d73);box-shadow:0 0 15px rgba(142,68,173,.4)}
.lane-中路 .lane-badge{background:linear-gradient(135deg,#2471a3,#1a5276);box-shadow:0 0 15px rgba(36,113,163,.4)}
.lane-发育路 .lane-badge{background:linear-gradient(135deg,#d4ac0d,#b7950b);box-shadow:0 0 15px rgba(212,172,13,.4)}
.lane-游走 .lane-badge{background:linear-gradient(135deg,#148f77,#0e6655);box-shadow:0 0 15px rgba(20,143,119,.4)}
.lane-title h2{font-size:20px}
.lane-title p{font-size:13px;color:var(--muted)}
.hero-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.hero-card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;cursor:pointer;
  transition:all .3s;
  position:relative;
}
.hero-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.5;transition:opacity .3s;
}
.hero-card:hover{
  border-color:var(--gold-bright);
  transform:translateY(-3px);
  box-shadow:0 12px 40px rgba(212,175,55,.2),0 0 0 1px rgba(212,175,55,.1);
}
.hero-card:hover::before{opacity:1}
.hero-card.expanded{grid-column:1/-1;cursor:default}
.hero-card.expanded .hero-head{flex-direction:row !important;align-items:center !important;padding:12px !important}
.hero-card.expanded .hero-avatar{width:56px !important;height:56px !important;border-radius:12px !important}
.hero-card.expanded .hero-name{font-size:17px !important}
.hero-card.expanded .hero-tags{justify-content:flex-start !important}
.hero-head{display:flex;gap:16px;padding:16px;align-items:center}
.hero-avatar{
  position:relative;
  width:72px;height:72px;border-radius:14px;
  overflow:hidden;flex-shrink:0;
  background:linear-gradient(135deg,rgba(200,170,80,.25),rgba(22,28,42,.9));
  border:2px solid rgba(200,170,80,.4);
  box-shadow:0 0 18px rgba(212,175,55,.25),0 4px 15px rgba(0,0,0,.4);
  position:relative;
}
.hero-avatar::after{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(180deg,transparent 60%,rgba(10,12,20,.4));
  pointer-events:none;
}
.hero-avatar img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;z-index:2}
.avatar-fallback{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:var(--gold);z-index:1}
.avatar-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--gold)}
.hero-meta{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.hero-name{font-size:18px;font-weight:800;color:#f0e6d2}
.hero-title{font-size:12px;color:var(--gold-dark);margin-bottom:4px;letter-spacing:.5px}
.hero-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:2px 8px;border-radius:6px;font-size:11px}
.tag-type{background:rgba(30,80,140,.3);color:#7ec3ff;border:1px solid rgba(74,158,255,.25)}
.tag-lane{background:rgba(180,140,40,.2);color:var(--gold);border:1px solid rgba(200,170,80,.3)}
.tag-counter{background:rgba(30,150,80,.15);color:#58d68d;border:1px solid rgba(46,204,113,.2)}
.tag-countered{background:rgba(192,57,43,.15);color:#ec7063;border:1px solid rgba(231,76,60,.2)}
.hero-body{display:none;padding:0 16px 16px;border-top:1px solid var(--line)}
.hero-card.expanded .hero-body{display:block}
.section{margin-top:16px}
.sec-title{
  font-size:14px;font-weight:700;
  color:var(--gold-bright);
  margin-bottom:12px;padding-bottom:8px;
  border-bottom:1px solid rgba(200,170,80,.25);
  letter-spacing:1px;
}
.skill-row{
  display:flex;gap:12px;padding:12px;
  background:rgba(30,38,55,.5);
  border-radius:10px;margin-bottom:8px;
  border:1px solid rgba(200,170,80,.08);
  transition:all .2s;
}
.skill-row:hover{background:rgba(212,175,55,.05);border-color:rgba(200,170,80,.15)}
.skill-badge{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;overflow:hidden}
.skill-0{background:linear-gradient(135deg,#e74c3c,#c0392b)}
.skill-1{background:linear-gradient(135deg,#3498db,#2980b9)}
.skill-2{background:linear-gradient(135deg,#2ecc71,#27ae60)}
.skill-3{background:linear-gradient(135deg,#f39c12,#e67e22)}
.skill-badge img{width:100%;height:100%;object-fit:cover}
.skill-info{flex:1}
.skill-name{font-weight:700;margin-bottom:4px}
.skill-cd{font-size:11px;color:var(--muted);font-weight:400}
.skill-desc{font-size:13px;color:#b8bfc9;line-height:1.5}
.combo-item{
  padding:12px;
  background:rgba(30,38,55,.6);
  border-left:3px solid var(--gold);
  border-radius:0 8px 8px 0;
  margin-bottom:8px;
  transition:all .2s;
}
.combo-item:hover{border-left-color:var(--gold-bright);background:rgba(212,175,55,.06)}
.combo-name{font-weight:700;color:var(--gold-bright);margin-bottom:4px}
.combo-seq{font-family:monospace;background:rgba(0,0,0,.3);padding:2px 8px;border-radius:4px;font-size:12px;margin-right:8px}
.combo-desc{font-size:13px;color:#b8bfc9;margin-top:4px}
.counter-group{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.counter-label{font-size:12px;color:var(--muted);min-width:40px}
.equip-row{display:flex;gap:10px;padding:8px 0;flex-wrap:wrap;align-items:flex-start}
.equip-label{color:var(--muted);font-size:13px;flex-shrink:0;padding-top:4px;font-weight:600}
.equip-items{display:flex;gap:6px;flex-wrap:wrap}
.equip-tag{
  background:rgba(30,60,100,.4);
  border:1px solid rgba(74,158,255,.25);
  color:#8ec5ff;
  padding:4px 12px;
  border-radius:6px;
  font-size:13px;
  font-weight:600;
}
.pro-tip{
  padding:12px 14px;
  background:rgba(212,175,55,.07);
  border-left:3px solid var(--gold);
  border-radius:0 10px 10px 0;
  margin-bottom:8px;
  font-size:14px;line-height:1.6;
  color:#e8dcc8;
}
.hot-grid{display:flex;flex-direction:column;gap:12px}
.hot-card{display:flex;gap:14px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:all .25s}
.hot-card:hover{transform:translateX(6px)}
.hot-rank{font-size:24px;font-weight:800;color:var(--muted);flex-shrink:0;width:42px;text-align:center;padding-top:8px}
.hot-main{flex:1}
.hot-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.hot-tier{padding:2px 10px;border-radius:6px;font-size:12px;font-weight:700}
.tier-t0{border-color:rgba(255,60,60,.5);background:rgba(255,60,60,.08)}.tier-t0 .hot-tier{background:linear-gradient(135deg,#ff3c3c,#c0392b);color:#fff}
.tier-t0 .hot-rank{color:#ff3c3c}
.tier-t05{border-color:rgba(255,150,50,.4);background:rgba(255,150,50,.06)}.tier-t05 .hot-tier{background:linear-gradient(135deg,#ff9632,#e67e22);color:#fff}
.tier-t05 .hot-rank{color:#ff9632}
.tier-t1{border-color:rgba(74,158,255,.4);background:rgba(74,158,255,.05)}.tier-t1 .hot-tier{background:linear-gradient(135deg,#4a9eff,#2980b9);color:#fff}
.tier-t1 .hot-rank{color:#4a9eff}
.tier-t2{border-color:rgba(150,150,150,.3)}.tier-t2 .hot-tier{background:linear-gradient(135deg,#8b949e,#6a737d);color:#fff}
.tier-t2 .hot-rank{color:#8b949e}
.hot-name{font-size:17px;font-weight:700;color:var(--text)}
.hot-stats{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-bottom:6px}
.hot-stat b{color:var(--gold)}
.hot-reason{font-size:13px;color:#b8bfc9;line-height:1.6}
@media (max-width:640px){.hot-stats{flex-direction:column;gap:4px}}
.tips-text{
  font-size:13px;color:#c8bfae;
  line-height:1.75;padding:12px;
  background:rgba(30,38,55,.5);
  border-radius:8px;
  border:1px solid rgba(200,170,80,.1);
}
.no-results{text-align:center;padding:60px;color:var(--muted);font-size:16px}
.footer-deco{
  text-align:center;padding:20px;
  font-size:24px;opacity:.4;
  letter-spacing:10px;
}
footer{
  text-align:center;padding:40px;
  color:var(--muted);font-size:12px;
  border-top:1px solid rgba(200,170,80,.2);
  margin-top:40px;
  background:linear-gradient(0deg,rgba(200,170,80,.04),transparent);
}


/* ==================== 移动端专属极致优化（体验级重构） ==================== */
@media (max-width: 640px) {
  /* 隐藏独立的冗余统计条，已融入 Tab 按钮，直接释放 70px 垂直高度！ */
  #stats { display: none !important; }
  
  header {
    padding: 10px 16px 8px !important;
    border-bottom: none !important;
  }
  h1 {
    font-size: 18px !important;
    letter-spacing: 1px;
    text-align: center;
  }

  /* 分路 Tab：单行横滑，绝不折行，带英雄数量角标 */
  nav {
    display: flex !important;
    flex-wrap: nowrap !important;
    gap: 8px !important;
    padding: 8px 14px 10px !important;
    overflow-x: auto !important;
    white-space: nowrap !important;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    position: sticky;
    top: 0;
    z-index: 95;
    background: rgba(10,12,20,.96) !important;
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(200,170,80,.18) !important;
  }
  nav::-webkit-scrollbar { display: none; }
  .nav-btn {
    padding: 6px 14px !important;
    font-size: 13px !important;
    border-radius: 18px !important;
    flex-shrink: 0 !important;
    min-height: 34px !important;
    display: inline-flex !important;
    align-items: center;
    gap: 4px;
    white-space: nowrap !important;
  }
  .nav-btn b {
    font-size: 11px;
    opacity: .75;
    font-weight: 700;
  }
  .nav-btn.active b {
    opacity: 1;
    color: #000;
  }

  /* 搜索框：40px 高度，紧凑布局 */
  .search-box {
    padding: 8px 14px 6px !important;
  }
  .search-box input {
    height: 38px !important;
    padding: 0 16px !important;
    font-size: 13px !important;
    border-radius: 19px !important;
  }
  .search-box > div {
    font-size: 10px !important;
    margin-top: 3px !important;
    opacity: .8;
  }

  /* 分路标题：紧凑条状，不占首屏 */
  .lane-section {
    margin-bottom: 16px !important;
  }
  .lane-header {
    padding: 8px 12px !important;
    gap: 8px !important;
    margin-bottom: 8px !important;
    border-radius: 8px !important;
  }
  .lane-badge {
    width: 28px !important;
    height: 28px !important;
    font-size: 14px !important;
    border-radius: 6px !important;
  }
  .lane-title h2 {
    font-size: 14px !important;
  }
  .lane-title p {
    font-size: 11px !important;
  }

  /* 核心：移动端 2 列精致紧凑网格（左头像 46px + 右侧信息饱满！） */
  main {
    padding: 0 10px 100px !important; /* 底部 100px 彻底避开右下角悬浮按钮 */
  }
  .hero-grid {
    grid-template-columns: repeat(2, 1fr) !important;
    gap: 8px !important;
  }
  .hero-card {
    border-radius: 10px !important;
  }
  /* 未展开态：横向布局，左头像，右名字+标签，饱满清晰 */
  .hero-head {
    padding: 8px !important;
    gap: 8px !important;
    flex-direction: row !important;
    align-items: center !important;
    text-align: left !important;
  }
  .hero-avatar {
    width: 46px !important;
    height: 46px !important;
    border-radius: 8px !important;
    flex-shrink: 0 !important;
  }
  .hero-meta {
    flex: 1 !important;
    min-width: 0 !important; /* 防止溢出 */
  }
  .hero-name {
    font-size: 14px !important;
    font-weight: 800 !important;
    line-height: 1.2 !important;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hero-title {
    font-size: 10px !important;
    margin-bottom: 3px !important;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hero-tags {
    justify-content: flex-start !important;
    gap: 3px !important;
  }
  .tag {
    padding: 1px 4px !important;
    font-size: 9px !important;
    border-radius: 4px !important;
    white-space: nowrap;
  }

  /* 展开详情卡片：通栏展开，单手舒适浏览 */
  .hero-card.expanded {
    grid-column: 1 / -1 !important;
  }
  .hero-card.expanded .hero-head {
    padding: 12px !important;
  }
  .hero-card.expanded .hero-avatar {
    width: 56px !important;
    height: 56px !important;
    border-radius: 10px !important;
  }
  .hero-card.expanded .hero-name {
    font-size: 16px !important;
  }
  .hero-card.expanded .hero-title {
    font-size: 12px !important;
  }
  .hero-card.expanded .tag {
    padding: 2px 6px !important;
    font-size: 11px !important;
  }
  .hero-body {
    padding: 0 10px 14px !important;
  }
  .sec-title {
    font-size: 13px !important;
    margin-bottom: 8px !important;
  }
  .skill-row {
    padding: 8px !important;
    gap: 8px !important;
  }
  .skill-badge {
    width: 32px !important;
    height: 32px !important;
    font-size: 10px !important;
  }
  .skill-name {
    font-size: 13px !important;
  }
  .skill-desc {
    font-size: 12px !important;
  }
  .tips-text {
    font-size: 12px !important;
    padding: 10px !important;
  }

  /* 悬浮壁纸按钮安全区 */
  .bg-switcher {
    right: 12px !important;
    bottom: calc(16px + env(safe-area-inset-bottom)) !important;
  }
  .bg-btn {
    width: 40px !important;
    height: 40px !important;
    font-size: 16px !important;
    box-shadow: 0 4px 16px rgba(0,0,0,.6) !important;
  }
}

.lane-guide{
  background:rgba(212,175,55,.06);
  border:1px solid rgba(212,175,55,.2);
  border-radius:12px;
  padding:14px 18px;
  margin:0 0 20px 0;
  font-size:13px;
  line-height:1.65;
  color:#e0d8c8;
}
.lane-guide-title{
  font-size:14px;
  font-weight:700;
  color:var(--gold);

【团战】：永远站最后排输出，谁离你近打谁，别追残血追进人堆。刺客切你边A边后撤，名刀/复活甲记得提前出`,
'游走':`【定位】：团队保护+开团发动机，不吃资源但要起节奏
【开局】：帮中抢2级或直接跟打野入侵。看对面打野动向，给队友报点
【中期】：游走三路帮队友建立优势，顺路做视野。真眼别省，龙坑/草丛必须排干净
【团战】：要么先手开团（张飞、太乙），要么死保C位（蔡文姬、明世隐）。别追残血，你的命比对面辅助值钱，站C位旁边拆火挡技能`
};
let lane='all';
function esc(s){return s?String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function render(){
const q=document.getElementById('search').value.trim().toLowerCase();
let list=HEROES;
if(lane!=='all')list=list.filter(h=>h.primary_lane===lane);
if(q)list=list.filter(h=>h.cname.toLowerCase().includes(q)||(h.title&&h.title.toLowerCase().includes(q)));
const stats={};HEROES.forEach(h=>stats[h.primary_lane]=(stats[h.primary_lane]||0)+1);
// 更新 Tab 按钮数字
document.querySelectorAll('.nav-btn').forEach(btn => {
  const l = btn.dataset.lane;
  if(l==='all') btn.innerHTML = `全部 <b>${HEROES.length}</b>`;
  else if(stats[l]) btn.innerHTML = `${l} <b>${stats[l]}</b>`;
});
// 桌面端保留 stats，移动端隐藏
const statsEl = document.getElementById('stats');
if(statsEl) statsEl.innerHTML=roleOrder.map(r=>`<div class="stat"><div class="stat-num">${stats[r]||0}</div><div class="stat-label">${r}</div></div>`).join('')+`<div class="stat"><div class="stat-num">${HEROES.length}</div><div class="stat-label">总英雄</div></div>`;
let html='';
if(lane==='all'){roleOrder.forEach(l=>{const lh=list.filter(h=>h.primary_lane===l);if(lh.length)html+=renderLane(l,lh)})}else{html+=renderLane(lane,list)}
document.getElementById('main').innerHTML=html||'<div class="no-results">未找到英雄</div>';
}
function renderLane(lane,heroes){
const guide = LANE_GUIDE[lane]||'';
let h=`<div class="lane-section lane-${lane}"><div class="lane-header"><div class="lane-badge">${laneIcons[lane]}</div><div class="lane-title"><h2>${lane}</h2><p>${laneDesc[lane]} · ${heroes.length}位</p></div></div>`;
if(guide){h+=`<div class="lane-guide"><div class="lane-guide-title">🎮 ${lane}打法思路</div><div class="lane-guide-body">${guide}</div></div>`}
h+=`<div class="hero-grid">`;
heroes.forEach(x=>h+=renderCard(x));
return h+'</div></div>';
}
function renderCard(h){
const iconUrl=`https://game.gtimg.cn/images/yxzj/img201606/heroimg/${h.eid}/${h.eid}.jpg`;
const skillIcons=['被动','1技能','2技能','大招','4技能'];
const skills=h.skills||[];const combos=h.combos||[];const tips=h.playstyle||h.tips||'';
let skillHtml='';skills.forEach((s,i)=>{const icon=skillIcons[i]||`技能${i}`;
const skillIcon=`https://game.gtimg.cn/images/yxzj/img201606/heroimg/${h.eid}/${h.eid}${i}.jpg`;
skillHtml+=`<div class="skill-row"><div class="skill-badge skill-${i}"><img src="${skillIcon}" onerror="this.outerHTML='<span style=font-size:12px;font-weight:700>技能</span>'"></div><div class="skill-info"><div class="skill-name">${esc(s.name)} <span class="skill-cd">CD:${s.cd||'0'}s</span></div><div class="skill-desc">${esc(s.desc)}</div></div></div>`});
let comboHtml='';combos.forEach(c=>{if(typeof c==='object'){comboHtml+=`<div class="combo-item"><span class="combo-name">${esc(c.name)}</span><span class="combo-seq">${esc(c.seq)}</span><div class="combo-desc">${esc(c.desc)}</div></div>`}else{comboHtml+=`<div class="combo-item"><span class="combo-seq">${esc(String(c))}</span></div>`}});
const counters=(h.counters||[]).map(x=>`<span class="tag tag-counter">${esc(x)}</span>`).join('');
const countered=(h.countered_by||[]).map(x=>`<span class="tag tag-countered">${esc(x)}</span>`).join('');
return `<div class="hero-card" onclick="this.classList.toggle('expanded')">
<div class="hero-head"><div class="hero-avatar"><div class="avatar-fallback">${h.cname[0]}</div>${iconUrl?`<img src="${iconUrl}" onerror="this.style.display='none'" alt="${h.cname}">`:''}</div>
<div class="hero-meta"><div class="hero-name">${esc(h.cname)}</div><div class="hero-title">${esc(h.title)}</div>
<div class="hero-tags"><span class="tag tag-type">${esc(h.type_name||'英雄')}</span><span class="tag tag-lane">${esc(h.primary_lane||'')}</span></div></div></div>
<div class="hero-body"><div class="section"><div class="sec-title">技能详解</div>${skillHtml}</div>
<div class="section"><div class="sec-title">铭文推荐</div><div class="tips-text">${esc(h.inscriptions||'宿命×10、虚空×10、调和×10')}</div></div>
<div class="section"><div class="sec-title">出装推荐</div>${(h.equips||[]).map((e,i)=>`<div class="equip-row"><span class="equip-label">方案${i+1}</span><span class="equip-items">${e.map(x=>`<span class="equip-tag">${x}</span>`).join('')}</span></div>`).join('')||'<div class="tips-text">抵抗之靴、红莲斗篷、不祥征兆、魔女斗篷、霸者重装、血魔之怒</div>'}</div>
<div class="section"><div class="sec-title">召唤师技能</div><div class="tips-text">${esc(h.summoner||'闪现 / 治疗术')}</div></div>
<div class="section"><div class="sec-title">技能加点</div><div class="tips-text">${esc(h.skill_order||'主二副一，有大点大')}</div></div>
<div class="section"><div class="sec-title">连招技巧</div>${comboHtml}</div>
<div class="section"><div class="sec-title">对位关系</div><div class="counter-group"><div class="counter-label">克制:</div>${counters||'无'}</div><div class="counter-group"><div class="counter-label">被克:</div>${countered||'无'}</div></div>
<div class="section"><div class="sec-title">分阶段打法</div><div class="tips-text">${esc(h.phases||'前期发育，中期游走，后期团战')}</div></div>
<div class="section"><div class="sec-title">进阶技巧</div>${(h.pro_tips||[]).map(t=>`<div class="pro-tip">${esc(t)}</div>`).join('')||'<div class="tips-text">暂无进阶技巧</div>'}</div>
${h.official_tips?`<div class="section"><div class="sec-title">官方攻略</div><div class="tips-text">${esc(h.official_tips)}</div></div>`:''}
${h.lineup?`<div class="section"><div class="sec-title">🤝 建议组队阵容</div>
<div class="tips-text" style="margin-bottom:8px"><strong>最佳搭档：</strong>${(h.lineup.teammates||[]).map(t=>`<span class="tag tag-counter" style="margin:2px 4px">${esc(t)}</span>`).join('')}</div>
<div class="tips-text" style="margin-bottom:8px;line-height:1.6"><strong>强势原因：</strong>${esc(h.lineup.synergy||'')}</div>
${h.lineup.composition?`<div class="tips-text" style="color:var(--accent,#e6a23c);font-size:12px"><strong>理想五人体系：</strong>${esc(h.lineup.composition)}</div>`:''}
</div>`:''}
<div class="section"><div class="sec-title">玩法技巧</div><div class="tips-text">${esc(tips)}</div></div></div></div>`;
}
document.querySelectorAll('.nav-btn').forEach(b=>{b.onclick=()=>{
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  lane=b.dataset.lane;
  render();
}});
document.getElementById('search').oninput=()=>render();
render();
</script>

<div class="bg-switcher">
  <button class="bg-btn" onclick="nextBg()" title="切换王者荣耀背景壁纸">🎨</button>
</div>
<script>
const BGS = [
  'https://game.gtimg.cn/images/yxzj/img201606/skin/hero-info/199/199-bigskin-8.jpg',
  'https://game.gtimg.cn/images/yxzj/img201606/skin/hero-info/190/190-bigskin-1.jpg',
  'https://game.gtimg.cn/images/yxzj/img201606/skin/hero-info/199/199-bigskin-1.jpg',
  'https://game.gtimg.cn/images/yxzj/img201606/skin/hero-info/507/507-bigskin-2.jpg',
  'https://game.gtimg.cn/images/yxzj/img201606/skin/hero-info/105/105-bigskin-2.jpg'
];
let bgIdx = 0;
function nextBg() {
  bgIdx = (bgIdx + 1) % BGS.length;
  document.body.style.backgroundImage = `radial-gradient(ellipse 90% 60% at 50% 20%, rgba(10,12,20,.45) 0%, rgba(10,12,20,.85) 100%), url('${BGS[bgIdx]}')`;
}
</script>
</body>

</html>
